<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>진도 기록부</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F3EEE1; --surface:#FFFFFF; --surface-2:#FFFDF8; --surface-inset:#EAE3D0;
    --ink:#23302A; --ink-soft:#62705F; --ink-faint:#93A08D;
    --line:#DAD0B4; --line-strong:#C6BA95;
    --accent:#2F6E4F; --accent-strong:#1E4F38; --accent-soft:#DCEBDD; --accent-ink:#F4FBF6;
    --gold:#B9862F; --gold-soft:#F1E4C6;
    --danger:#B1472E; --danger-soft:#F3DED8;
    --radius:10px; --radius-sm:6px;
    --font-display:'Noto Serif KR', serif; --font-body:'Noto Sans KR', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16211B; --surface:#1D2B23; --surface-2:#223327; --surface-inset:#14201A;
      --ink:#EDE7D3; --ink-soft:#A6B6A9; --ink-faint:#5F7267;
      --line:#33463A; --line-strong:#435A4B;
      --accent:#7BCB9B; --accent-strong:#9FE0B8; --accent-soft:#24402F; --accent-ink:#0E1913;
      --gold:#E4BC6B; --gold-soft:#3A331E;
      --danger:#E28A70; --danger-soft:#3A2620;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16211B; --surface:#1D2B23; --surface-2:#223327; --surface-inset:#14201A;
    --ink:#EDE7D3; --ink-soft:#A6B6A9; --ink-faint:#5F7267;
    --line:#33463A; --line-strong:#435A4B;
    --accent:#7BCB9B; --accent-strong:#9FE0B8; --accent-soft:#24402F; --accent-ink:#0E1913;
    --gold:#E4BC6B; --gold-soft:#3A331E;
    --danger:#E28A70; --danger-soft:#3A2620;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5;}
  button, input{font-family:inherit; color:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  .app{display:flex; min-height:100vh; max-width:1400px; margin:0 auto;}

  /* ---------- sidebar ---------- */
  .sidebar{width:250px; flex:none; background:var(--surface-inset); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:14px; min-height:100vh;}
  .brand{font-family:var(--font-display); font-weight:700; font-size:20px; padding:2px 6px 10px; border-bottom:2px solid var(--accent); display:flex; align-items:baseline; gap:6px;}
  .brand small{font-family:var(--font-body); font-weight:500; font-size:11px; color:var(--ink-soft); letter-spacing:.02em;}
  .class-list{display:flex; flex-direction:column; gap:4px; overflow-y:auto;}
  .class-row{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--radius-sm); cursor:pointer; border:1px solid transparent; position:relative;}
  .class-row:hover{background:var(--surface-2);}
  .class-row.is-active{background:var(--surface); border-color:var(--line-strong); box-shadow:0 1px 0 rgba(0,0,0,.03);}
  .class-dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .class-row-main{min-width:0; flex:1;}
  .class-row-name{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .class-row-sub{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .class-edit-btn{opacity:0; background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:13px; padding:4px;}
  .class-row:hover .class-edit-btn{opacity:1;}
  .sidebar-divider{border:none; border-top:1px solid var(--line); margin:2px 0;}
  .btn-add-class{background:var(--surface); border:1px dashed var(--line-strong); color:var(--ink-soft); border-radius:var(--radius-sm); padding:9px; cursor:pointer; font-size:13px; font-weight:600;}
  .btn-add-class:hover{color:var(--accent-strong); border-color:var(--accent);}
  .archive-toggle{background:none; border:none; color:var(--ink-faint); font-size:11.5px; cursor:pointer; text-align:left; padding:2px 6px;}
  .archive-toggle:hover{color:var(--ink-soft); text-decoration:underline;}

  /* ---------- main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .main-header{padding:22px 30px 0; border-bottom:1px solid var(--line);}
  .main-header .empty-note{color:var(--ink-soft); padding-bottom:20px;}
  .class-title-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .class-title{font-family:var(--font-display); font-weight:700; font-size:26px; text-wrap:balance; display:flex; align-items:center; gap:10px;}
  .class-title .class-dot{width:11px; height:11px;}
  .class-subtitle{color:var(--ink-soft); font-size:13px; margin-top:3px;}
  .header-actions{display:flex; gap:8px; padding-bottom:10px;}
  .tab-nav{display:flex; gap:2px; padding:14px 30px 0;}
  .tab-btn{background:none; border:none; padding:9px 16px; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.is-active{color:var(--accent-strong); border-bottom-color:var(--accent);}
  .tab-content{padding:22px 30px 60px; flex:1;}

  /* buttons */
  .btn{background:var(--surface); border:1px solid var(--line-strong); color:var(--ink); border-radius:var(--radius-sm); padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn-ghost{background:none; border:1px solid transparent; color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink); background:var(--surface-2);}
  .btn-danger-text{background:none; border:none; color:var(--danger); cursor:pointer; font-size:13px; font-weight:600; padding:6px 4px;}
  .btn-sm{padding:5px 10px; font-size:12px;}

  /* ---------- record tab ---------- */
  .record-toolbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .date-nav{display:flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:4px;}
  .date-nav button.step{background:none; border:none; font-size:16px; width:28px; height:28px; cursor:pointer; color:var(--ink-soft); border-radius:4px;}
  .date-nav button.step:hover{background:var(--surface-2); color:var(--ink);}
  .date-nav input[type=date]{border:none; background:none; font-family:var(--font-mono); font-size:14px; padding:4px 6px;}
  .date-label{font-size:12.5px; color:var(--ink-soft); padding:0 4px;}
  .progress-pill{font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-family:var(--font-mono);}
  .progress-pill.is-full{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong);}

  .session-meta{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .session-meta input{flex:1; min-width:220px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 12px; font-size:13.5px;}
  .session-meta input:focus{border-color:var(--accent);}
  .session-meta input.topic-input{font-weight:600;}

  .date-chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:14px; margin-bottom:6px; border-bottom:1px dashed var(--line);}
  .chip{flex:none; display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11.5px; padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink-soft); white-space:nowrap;}
  .chip:hover{border-color:var(--accent);}
  .chip.is-active{border-color:var(--accent); color:var(--ink); background:var(--accent-soft);}
  .chip-dot{width:7px; height:7px; border-radius:50%;}
  .chip-dot.full{background:var(--accent);} .chip-dot.partial{background:var(--gold);} .chip-dot.empty{background:var(--ink-faint);}

  .roster-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
  table.roster{width:100%; border-collapse:collapse; min-width:920px;}
  table.roster th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surface-2); position:sticky; top:0;}
  table.roster td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.roster tr:last-child td{border-bottom:none;}
  table.roster tr:hover td{background:var(--surface-2);}
  td.name-cell{font-weight:600; white-space:nowrap;}
  td.name-cell .stu-phone{display:block; font-weight:400; font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}
  .cell-input{width:100%; min-width:150px; background:transparent; border:1px solid transparent; border-radius:5px; padding:6px 7px; font-size:13px;}
  .cell-input:hover{border-color:var(--line);}
  .cell-input:focus{border-color:var(--accent); background:var(--surface);}
  td.col-progress .cell-input{min-width:170px;}
  td.col-note .cell-input{min-width:150px;}

  .stars{display:flex; gap:1px;}
  .star{background:none; border:none; cursor:pointer; font-size:17px; color:var(--line-strong); padding:1px;}
  .star:hover{color:var(--gold);}
  .star.is-on{color:var(--gold);}
  .star.readonly{cursor:default;}
  .stars-label{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}

  .hw-block{min-width:180px;}
  .check{display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; margin-bottom:5px;}
  .check input{accent-color:var(--accent); width:14px; height:14px;}
  .hw-prev-text{font-size:11px; color:var(--ink-faint); font-style:italic; margin-bottom:6px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hw-new{font-size:12.5px;}

  .empty-state{display:flex; flex-direction:column; align-items:flex-start; gap:14px; padding:50px 10px; max-width:480px;}
  .empty-state h2{font-family:var(--font-display); font-size:22px; margin:0;}
  .empty-state p{color:var(--ink-soft); margin:0; font-size:13.5px; line-height:1.6;}

  /* ---------- students tab ---------- */
  .students-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .students-toolbar .count{color:var(--ink-soft); font-size:13px;}
  table.students{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  table.students th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--line);}
  table.students td{padding:10px 14px; border-bottom:1px solid var(--line); font-size:13.5px;}
  table.students tr:last-child td{border-bottom:none;}
  table.students tr.is-inactive td{color:var(--ink-faint);}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px;}
  .badge.active{background:var(--accent-soft); color:var(--accent-strong);}
  .badge.inactive{background:var(--surface-inset); color:var(--ink-faint);}
  .row-actions{display:flex; gap:10px;}
  .row-actions button{background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:12.5px; font-weight:600;}
  .row-actions button:hover{color:var(--accent-strong);}

  /* ---------- history tab ---------- */
  .history-picker{margin-bottom:18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .history-picker select{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 10px; font-size:13.5px; min-width:180px;}
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:22px;}
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .stat-tile .num{font-family:var(--font-mono); font-size:22px; font-weight:600;}
  .stat-tile .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .timeline{display:flex; flex-direction:column; gap:0;}
  .timeline-item{display:grid; grid-template-columns:100px 1fr; gap:16px; padding:14px 0; border-bottom:1px solid var(--line);}
  .timeline-item:last-child{border-bottom:none;}
  .tl-date{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); padding-top:2px;}
  .tl-body{display:flex; flex-direction:column; gap:5px;}
  .tl-topic{font-size:11.5px; color:var(--ink-faint);}
  .tl-progress{font-weight:600; font-size:13.5px;}
  .tl-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);}
  .tl-note{font-size:12.5px; color:var(--ink-soft); font-style:italic;}
  .hw-badge{font-size:11px; font-weight:600; padding:2px 7px; border-radius:999px;}
  .hw-badge.done{background:var(--accent-soft); color:var(--accent-strong);}
  .hw-badge.undone{background:var(--danger-soft); color:var(--danger);}

  /* ---------- modal ---------- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(20,25,20,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{background:var(--surface); border-radius:var(--radius); padding:24px; width:100%; max-width:420px; box-shadow:0 12px 40px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto;}
  .modal h3{font-family:var(--font-display); font-size:18px; margin:0 0 16px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field textarea{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 11px; font-size:13.5px; font-family:inherit;}
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  .swatches{display:flex; gap:8px;}
  .swatch{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.is-selected{border-color:var(--ink);}
  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px;}
  .modal-actions-right{display:flex; gap:8px;}

  /* ---------- toast ---------- */
  .toast-root{position:fixed; bottom:20px; right:20px; z-index:60; display:flex; flex-direction:column; gap:8px; pointer-events:none;}
  .toast{background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:999px; opacity:0; transform:translateY(6px); transition:opacity .2s, transform .2s;}
  .toast.is-danger{background:var(--danger);}
  .toast.is-show{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){ .toast{transition:none;} }

  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; min-height:auto; align-items:center;}
    .class-list{flex-direction:row;}
    .brand{border-bottom:none; padding:0 10px 0 0; border-right:2px solid var(--accent);}
    .main-header, .tab-nav, .tab-content{padding-left:16px; padding-right:16px;}
  }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">진도 기록부 <small>학원 관리</small></div>
    <div class="class-list" id="classList"></div>
    <hr class="sidebar-divider">
    <button class="btn-add-class" id="addClassBtn">+ 새 반 만들기</button>
    <button class="archive-toggle" id="archiveToggle"></button>
  </aside>
  <main class="main">
    <div class="main-header" id="mainHeader"></div>
    <nav class="tab-nav" id="tabNav"></nav>
    <section class="tab-content" id="tabContent"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
(function(){
  "use strict";

  var CLASS_COLORS = ['#2F6E4F','#2E5FA3','#A34B2E','#7A4FA3','#A3862E','#3C8B8B'];

  var db = null;
  var unsubClasses = null, unsubStudents = null, unsubSessions = null;
  var state = {
    classes: [],
    students: [],
    sessions: [],
    selectedClassId: null,
    tab: 'record',
    selectedDate: todayStr(),
    historyStudentId: null,
    modalOpen: false,
    showArchived: false
  };
  var currentSessionData = null; // {id, exists, classId, date, topic, memo, records:{}}

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function todayStr(d){
    d = d || new Date();
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function shiftDate(dateStr, days){
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+days);
    return todayStr(d);
  }
  function formatKoreanDate(dateStr, opts){
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    var week = ['일','월','화','수','목','금','토'];
    if(opts && opts.short) return parts[1]+'/'+parts[2];
    return parts[1]+'월 '+parts[2]+'일 ('+week[d.getDay()]+')';
  }
  function nowIso(){ return new Date().toISOString(); }
  function debounce(fn, ms){
    var t;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, ms);
    };
  }
  function understandingLabel(v){
    if(!v) return '미평가';
    if(v <= 2) return '하';
    if(v === 3) return '중';
    return '상';
  }
  function uid(){ return 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function showToast(msg, isDanger){
    var root = document.getElementById('toastRoot');
    var el = document.createElement('div');
    el.className = 'toast' + (isDanger ? ' is-danger' : '');
    el.textContent = msg;
    root.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('is-show'); });
    setTimeout(function(){
      el.classList.remove('is-show');
      setTimeout(function(){ el.remove(); }, 250);
    }, 1800);
  }

  function activeClasses(){ return state.classes.filter(function(c){ return !c.archived; }); }
  function archivedClasses(){ return state.classes.filter(function(c){ return c.archived; }); }
  function getClass(id){ return state.classes.find(function(c){ return c.id === id; }); }
  function activeStudents(){ return state.students.filter(function(s){ return s.active !== false; }); }

  // ---------------- DB init ----------------
  function init(){
    if(!window.claude || !window.claude.use){
      renderNoDb();
      return;
    }
    window.claude.use('db').then(function(dbNs){
      db = dbNs;
      if(!db){ renderNoDb(); return; }
      subscribeClasses();
    });
  }

  function renderNoDb(){
    document.getElementById('mainHeader').innerHTML = '';
    document.getElementById('tabNav').innerHTML = '';
    document.getElementById('tabContent').innerHTML =
      '<div class="empty-state"><h2>저장소를 불러올 수 없어요</h2>' +
      '<p>이 화면을 지원하는 뷰어에서 열면 기록이 자동으로 저장됩니다. 페이지를 다시 열어보세요.</p></div>';
  }

  function subscribeClasses(){
    if(unsubClasses) unsubClasses();
    unsubClasses = db.collection('classes').orderBy('createdAt','asc').onSnapshot(function(snap){
      state.classes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if(!state.selectedClassId){
        var first = activeClasses()[0];
        if(first) selectClass(first.id);
      } else if(!getClass(state.selectedClassId)){
        state.selectedClassId = null;
      }
      if(!state.modalOpen){
        renderSidebar();
        renderHeader();
        if(!state.selectedClassId) renderTabContentEmpty();
      }
    }, function(err){ console.error('classes', err); });
  }

  function subscribeStudents(classId){
    if(unsubStudents) unsubStudents();
    unsubStudents = db.collection('students').where('classId','==',classId).onSnapshot(function(snap){
      state.students = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
        .sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'ko'); });
      if(!state.modalOpen){
        if(state.tab === 'record') loadSessionForDate();
        else render();
      }
    }, function(err){ console.error('students', err); });
  }

  function subscribeSessions(classId){
    if(unsubSessions) unsubSessions();
    unsubSessions = db.collection('sessions').where('classId','==',classId).orderBy('date','desc').limit(200)
      .onSnapshot(function(snap){
        state.sessions = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        if(!state.modalOpen){
          if(state.tab === 'record') renderDateChips();
          if(state.tab === 'history') renderTabContent();
        }
      }, function(err){ console.error('sessions', err); });
  }

  function selectClass(id){
    state.selectedClassId = id;
    state.selectedDate = todayStr();
    subscribeStudents(id);
    subscribeSessions(id);
    render();
  }

  function sessionIdFor(classId, date){ return classId + '__' + date; }

  function loadSessionForDate(){
    if(!state.selectedClassId) return;
    var id = sessionIdFor(state.selectedClassId, state.selectedDate);
    db.doc('sessions/'+id).get().then(function(snap){
      if(snap.exists){
        var data = snap.data();
        currentSessionData = Object.assign({id: id, exists: true}, data);
        currentSessionData.records = data.records || {};
      } else {
        currentSessionData = {id: id, exists: false, classId: state.selectedClassId, date: state.selectedDate, topic:'', memo:'', records:{}};
      }
      if(state.tab === 'record') renderTabContent();
    }).catch(function(err){
      console.error('load session', err);
      currentSessionData = {id: id, exists: false, classId: state.selectedClassId, date: state.selectedDate, topic:'', memo:'', records:{}};
      if(state.tab === 'record') renderTabContent();
    });
  }

  function changeDate(newDate){
    state.selectedDate = newDate;
    loadSessionForDate();
  }

  // ---------------- writes ----------------
  function updateLocalRecord(studentId, field, value){
    if(!currentSessionData) return;
    currentSessionData.records[studentId] = Object.assign({}, currentSessionData.records[studentId], {});
    currentSessionData.records[studentId][field] = value;
  }

  function commitField(studentId, field, value){
    if(!db || !currentSessionData) return;
    var ref = db.doc('sessions/'+currentSessionData.id);
    var payload = { records: {} };
    payload.records[studentId] = {};
    payload.records[studentId][field] = value;
    payload.records[studentId].updatedAt = nowIso();
    var p;
    if(currentSessionData.exists){
      p = ref.update(payload);
    } else {
      var full = {
        classId: currentSessionData.classId,
        date: currentSessionData.date,
        topic: currentSessionData.topic || '',
        memo: currentSessionData.memo || '',
        createdAt: nowIso(),
        records: payload.records
      };
      currentSessionData.exists = true;
      p = ref.set(full);
    }
    p.then(function(){ showToast('저장됨'); })
     .catch(function(err){ console.error(err); showToast('저장 실패 · 다시 시도해 주세요', true); });
  }

  function commitSessionField(field, value){
    if(!db || !currentSessionData) return;
    currentSessionData[field] = value;
    var ref = db.doc('sessions/'+currentSessionData.id);
    var payload = {}; payload[field] = value;
    var p;
    if(currentSessionData.exists){
      p = ref.update(payload);
    } else {
      var full = {
        classId: currentSessionData.classId,
        date: currentSessionData.date,
        topic: field === 'topic' ? value : (currentSessionData.topic || ''),
        memo: field === 'memo' ? value : (currentSessionData.memo || ''),
        createdAt: nowIso(),
        records: currentSessionData.records || {}
      };
      currentSessionData.exists = true;
      p = ref.set(full);
    }
    p.then(function(){ showToast('저장됨'); })
     .catch(function(err){ console.error(err); showToast('저장 실패 · 다시 시도해 주세요', true); });
  }

  var debouncedTextSave = debounce(function(studentId, field, value){ commitField(studentId, field, value); }, 600);
  var debouncedSessionSave = debounce(function(field, value){ commitSessionField(field, value); }, 600);

  // ---------------- render: shell ----------------
  function render(){
    renderSidebar();
    renderHeader();
    renderTabNav();
    renderTabContent();
  }

  function renderSidebar(){
    var list = activeClasses();
    var html = list.map(function(c){
      var isActive = c.id === state.selectedClassId;
      return '<div class="class-row ' + (isActive?'is-active':'') + '" data-id="'+c.id+'">' +
        '<span class="class-dot" style="background:'+esc(c.color||CLASS_COLORS[0])+'"></span>' +
        '<div class="class-row-main">' +
          '<div class="class-row-name">'+esc(c.name)+'</div>' +
          '<div class="class-row-sub">'+esc(c.schedule||c.subject||'')+'</div>' +
        '</div>' +
        '<button class="class-edit-btn" data-edit="'+c.id+'" title="반 정보 수정">✎</button>' +
      '</div>';
    }).join('');
    if(!list.length){
      html = '<div style="padding:14px 8px; font-size:12.5px; color:var(--ink-soft);">아직 반이 없어요.<br>아래 버튼으로 첫 반을 만들어보세요.</div>';
    }
    document.getElementById('classList').innerHTML = html;
    var archived = archivedClasses();
    var toggleBtn = document.getElementById('archiveToggle');
    toggleBtn.textContent = archived.length ? ('보관함 ('+archived.length+')' + (state.showArchived ? ' 숨기기' : ' 보기')) : '';
    if(state.showArchived && archived.length){
      document.getElementById('classList').innerHTML += '<div style="height:6px"></div>' + archived.map(function(c){
        return '<div class="class-row" data-id="'+c.id+'" style="opacity:.6">' +
          '<span class="class-dot" style="background:'+esc(c.color||CLASS_COLORS[0])+'"></span>' +
          '<div class="class-row-main"><div class="class-row-name">'+esc(c.name)+' (보관됨)</div></div>' +
          '<button class="class-edit-btn" data-edit="'+c.id+'" title="반 정보 수정">✎</button>' +
        '</div>';
      }).join('');
    }
  }

  function renderHeader(){
    var header = document.getElementById('mainHeader');
    var cls = getClass(state.selectedClassId);
    if(!cls){
      header.innerHTML = '';
      document.getElementById('tabNav').innerHTML = '';
      return;
    }
    header.innerHTML =
      '<div class="class-title-row">' +
        '<div>' +
          '<div class="class-title"><span class="class-dot" style="background:'+esc(cls.color||CLASS_COLORS[0])+'"></span>'+esc(cls.name)+'</div>' +
          '<div class="class-subtitle">'+esc([cls.subject, cls.schedule].filter(Boolean).join(' · ') || '설명 없음')+' · 학생 '+activeStudents().length+'명</div>' +
        '</div>' +
      '</div>';
  }

  function renderTabNav(){
    var nav = document.getElementById('tabNav');
    if(!state.selectedClassId){ nav.innerHTML=''; return; }
    var tabs = [['record','진도 기록'],['students','학생 관리'],['history','히스토리']];
    nav.innerHTML = tabs.map(function(t){
      return '<button class="tab-btn '+(state.tab===t[0]?'is-active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';
    }).join('');
  }

  function renderTabContentEmpty(){
    document.getElementById('tabContent').innerHTML =
      '<div class="empty-state">' +
        '<h2>첫 반을 만들어보세요</h2>' +
        '<p>반을 만들고 학생을 등록하면, 매 수업마다 학생별 진도·이해도·숙제·메모를 몇 번의 클릭으로 기록할 수 있어요. 기록은 자동 저장되고 반별 히스토리로 언제든 다시 볼 수 있습니다.</p>' +
        '<button class="btn btn-primary" id="emptyAddClassBtn">+ 새 반 만들기</button>' +
      '</div>';
    var btn = document.getElementById('emptyAddClassBtn');
    if(btn) btn.addEventListener('click', function(){ openClassModal(); });
  }

  function renderTabContent(){
    if(!state.selectedClassId){ renderTabContentEmpty(); return; }
    if(state.tab === 'record') renderRecordTab();
    else if(state.tab === 'students') renderStudentsTab();
    else renderHistoryTab();
  }

  // ---------------- record tab ----------------
  function prevHomeworkFor(studentId){
    for(var i=0;i<state.sessions.length;i++){
      var s = state.sessions[i];
      if(s.date >= state.selectedDate) continue;
      var rec = (s.records||{})[studentId];
      if(rec && rec.homeworkAssigned){
        return formatKoreanDate(s.date, {short:true}) + ' · ' + rec.homeworkAssigned;
      }
    }
    return '';
  }

  function chipStatus(session){
    var total = activeStudents().length || 1;
    var count = Object.keys(session.records || {}).filter(function(sid){
      var r = session.records[sid];
      return r && (r.progress || r.understanding || r.homeworkAssigned || r.note);
    }).length;
    if(count === 0) return 'empty';
    if(count >= total) return 'full';
    return 'partial';
  }

  function renderDateChips(){
    var wrap = document.getElementById('dateChips');
    if(!wrap) return;
    var sorted = state.sessions.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).slice(0, 30);
    wrap.innerHTML = sorted.map(function(s){
      return '<button class="chip '+(s.date===state.selectedDate?'is-active':'')+'" data-jump="'+s.date+'">' +
        '<span class="chip-dot '+chipStatus(s)+'"></span>' + formatKoreanDate(s.date,{short:true}) +
      '</button>';
    }).join('') || '<span style="font-size:11.5px; color:var(--ink-faint);">아직 기록된 수업이 없어요.</span>';
  }

  function renderRecordTab(){
    if(!currentSessionData){ loadSessionForDate(); return; }
    var students = activeStudents();
    var filled = students.filter(function(s){
      var r = currentSessionData.records[s.id];
      return r && (r.progress || r.understanding || r.homeworkAssigned || r.note);
    }).length;
    var pillFull = students.length > 0 && filled === students.length;

    var rowsHtml = students.map(function(s){
      var rec = currentSessionData.records[s.id] || {};
      var stars = '';
      for(var i=1;i<=5;i++){
        stars += '<button type="button" class="star '+(rec.understanding>=i?'is-on':'')+'" data-val="'+i+'" data-student="'+s.id+'" aria-label="'+i+'점">★</button>';
      }
      var prevHw = prevHomeworkFor(s.id);
      return '<tr>' +
        '<td class="name-cell">'+esc(s.name)+(s.phone?'<span class="stu-phone">'+esc(s.phone)+'</span>':'')+'</td>' +
        '<td class="col-progress"><input type="text" class="cell-input" data-student="'+s.id+'" data-field="progress" placeholder="예: 3단원 p.44~52" value="'+esc(rec.progress||'')+'"></td>' +
        '<td><div class="stars" data-student="'+s.id+'">'+stars+'</div><div class="stars-label">'+understandingLabel(rec.understanding)+'</div></td>' +
        '<td class="hw-block">' +
          '<label class="check"><input type="checkbox" data-student="'+s.id+'" data-field="homeworkDone" '+(rec.homeworkDone?'checked':'')+'><span>지난 숙제 완료</span></label>' +
          '<div class="hw-prev-text" title="'+esc(prevHw||'이전 숙제 없음')+'">'+esc(prevHw || '이전 숙제 없음')+'</div>' +
          '<input type="text" class="cell-input hw-new" data-student="'+s.id+'" data-field="homeworkAssigned" placeholder="오늘 낸 숙제" value="'+esc(rec.homeworkAssigned||'')+'">' +
        '</td>' +
        '<td class="col-note"><input type="text" class="cell-input" data-student="'+s.id+'" data-field="note" placeholder="특이사항" value="'+esc(rec.note||'')+'"></td>' +
      '</tr>';
    }).join('');

    if(!students.length){
      rowsHtml = '<tr><td colspan="5" style="text-align:center; color:var(--ink-soft); padding:30px;">이 반에 등록된 학생이 없어요. "학생 관리" 탭에서 추가해 주세요.</td></tr>';
    }

    document.getElementById('tabContent').innerHTML =
      '<div class="record-toolbar">' +
        '<div class="date-nav">' +
          '<button class="step" id="prevDay" title="전날">‹</button>' +
          '<input type="date" id="datePicker" value="'+state.selectedDate+'">' +
          '<button class="step" id="nextDay" title="다음날">›</button>' +
          '<button class="btn btn-sm" id="todayBtn">오늘</button>' +
          '<span class="date-label">'+formatKoreanDate(state.selectedDate)+'</span>' +
        '</div>' +
        '<div class="progress-pill '+(pillFull?'is-full':'')+'">'+filled+' / '+students.length+'명 기록</div>' +
      '</div>' +
      '<div class="session-meta">' +
        '<input type="text" id="topicInput" class="topic-input" placeholder="오늘 수업 주제 (예: 3단원 이차방정식)" value="'+esc(currentSessionData.topic||'')+'">' +
        '<input type="text" id="memoInput" class="session-memo-input" placeholder="수업 전체 메모 (선택)" value="'+esc(currentSessionData.memo||'')+'">' +
      '</div>' +
      '<div class="date-chips" id="dateChips"></div>' +
      '<div class="roster-scroll"><table class="roster">' +
        '<thead><tr><th style="width:120px">이름</th><th>진도 범위</th><th style="width:110px">이해도</th><th style="width:210px">숙제</th><th>메모</th></tr></thead>' +
        '<tbody id="rosterBody">'+rowsHtml+'</tbody>' +
      '</table></div>';

    renderDateChips();
    wireRecordEvents();
  }

  function wireRecordEvents(){
    var content = document.getElementById('tabContent');
    document.getElementById('prevDay').addEventListener('click', function(){ changeDate(shiftDate(state.selectedDate,-1)); });
    document.getElementById('nextDay').addEventListener('click', function(){ changeDate(shiftDate(state.selectedDate,1)); });
    document.getElementById('todayBtn').addEventListener('click', function(){ changeDate(todayStr()); });
    document.getElementById('datePicker').addEventListener('change', function(e){ if(e.target.value) changeDate(e.target.value); });
    document.getElementById('topicInput').addEventListener('input', function(e){
      currentSessionData.topic = e.target.value;
      debouncedSessionSave('topic', e.target.value);
    });
    document.getElementById('memoInput').addEventListener('input', function(e){
      currentSessionData.memo = e.target.value;
      debouncedSessionSave('memo', e.target.value);
    });
    document.getElementById('dateChips').addEventListener('click', function(e){
      var chip = e.target.closest('[data-jump]');
      if(chip) changeDate(chip.getAttribute('data-jump'));
    });

    var roster = document.getElementById('rosterBody');
    roster.addEventListener('input', function(e){
      var t = e.target;
      if(t.matches('input.cell-input')){
        var studentId = t.dataset.student, field = t.dataset.field;
        updateLocalRecord(studentId, field, t.value);
        debouncedTextSave(studentId, field, t.value);
      }
    });
    roster.addEventListener('change', function(e){
      var t = e.target;
      if(t.matches('input[type=checkbox][data-field=homeworkDone]')){
        var studentId = t.dataset.student;
        updateLocalRecord(studentId, 'homeworkDone', t.checked);
        commitField(studentId, 'homeworkDone', t.checked);
      }
    });
    roster.addEventListener('click', function(e){
      var star = e.target.closest('.star');
      if(!star) return;
      var studentId = star.dataset.student;
      var val = Number(star.dataset.val);
      var wrap = star.closest('.stars');
      Array.prototype.forEach.call(wrap.querySelectorAll('.star'), function(st){
        st.classList.toggle('is-on', Number(st.dataset.val) <= val);
      });
      wrap.parentElement.querySelector('.stars-label').textContent = understandingLabel(val);
      updateLocalRecord(studentId, 'understanding', val);
      commitField(studentId, 'understanding', val);
    });
  }

  // ---------------- students tab ----------------
  function renderStudentsTab(){
    var students = state.students.slice().sort(function(a,b){
      if((a.active!==false) !== (b.active!==false)) return a.active===false ? 1 : -1;
      return (a.name||'').localeCompare(b.name||'','ko');
    });
    var rows = students.map(function(s){
      var isActive = s.active !== false;
      return '<tr class="'+(isActive?'':'is-inactive')+'">' +
        '<td>'+esc(s.name)+'</td>' +
        '<td class="mono">'+esc(s.phone||'-')+'</td>' +
        '<td class="mono">'+esc(s.parentPhone||'-')+'</td>' +
        '<td><span class="badge '+(isActive?'active':'inactive')+'">'+(isActive?'활성':'비활성')+'</span></td>' +
        '<td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(s.note||'')+'</td>' +
        '<td><div class="row-actions"><button data-edit-student="'+s.id+'">수정</button><button data-toggle-student="'+s.id+'">'+(isActive?'비활성화':'활성화')+'</button></div></td>' +
      '</tr>';
    }).join('');
    document.getElementById('tabContent').innerHTML =
      '<div class="students-toolbar">' +
        '<div class="count">전체 '+students.length+'명 · 활성 '+students.filter(function(s){return s.active!==false;}).length+'명</div>' +
        '<button class="btn btn-primary" id="addStudentBtn">+ 학생 추가</button>' +
      '</div>' +
      (students.length ?
        '<table class="students"><thead><tr><th>이름</th><th>연락처</th><th>학부모 연락처</th><th>상태</th><th>메모</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
        : '<div class="empty-state"><h2>학생을 등록해 주세요</h2><p>학생을 추가하면 진도 기록 탭의 출석부에 자동으로 나타나요.</p></div>');

    var addBtn = document.getElementById('addStudentBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ openStudentModal(); });
    document.querySelectorAll('[data-edit-student]').forEach(function(btn){
      btn.addEventListener('click', function(){ openStudentModal(btn.getAttribute('data-edit-student')); });
    });
    document.querySelectorAll('[data-toggle-student]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-toggle-student');
        var s = state.students.find(function(x){ return x.id===id; });
        db.doc('students/'+id).update({ active: s.active===false }).then(function(){
          showToast(s.active===false ? '활성화했어요' : '비활성화했어요');
        }).catch(function(){ showToast('처리 실패', true); });
      });
    });
  }

  function openStudentModal(studentId){
    var editing = studentId ? state.students.find(function(s){ return s.id===studentId; }) : null;
    state.modalOpen = true;
    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">' +
        '<h3>'+(editing?'학생 정보 수정':'학생 추가')+'</h3>' +
        '<div class="field"><label>이름 *</label><input type="text" id="mStuName" value="'+esc(editing?editing.name:'')+'" placeholder="예: 김민준"></div>' +
        '<div class="field"><label>연락처</label><input type="text" id="mStuPhone" value="'+esc(editing?editing.phone:'')+'" placeholder="010-0000-0000"></div>' +
        '<div class="field"><label>학부모 연락처</label><input type="text" id="mStuParent" value="'+esc(editing?editing.parentPhone:'')+'" placeholder="010-0000-0000"></div>' +
        '<div class="field"><label>메모</label><textarea id="mStuNote" rows="2" placeholder="특이사항 (선택)">'+esc(editing?editing.note:'')+'</textarea></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="mCancel">취소</button>' +
          '<div class="modal-actions-right"><button class="btn btn-primary" id="mSave">저장</button></div>' +
        '</div>' +
      '</div></div>';
    document.getElementById('mCancel').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', function(e){ if(e.target.id==='modalBackdrop') closeModal(); });
    document.getElementById('mSave').addEventListener('click', function(){
      var name = document.getElementById('mStuName').value.trim();
      if(!name){ showToast('이름을 입력해 주세요', true); return; }
      var data = {
        name: name,
        phone: document.getElementById('mStuPhone').value.trim(),
        parentPhone: document.getElementById('mStuParent').value.trim(),
        note: document.getElementById('mStuNote').value.trim(),
        classId: state.selectedClassId
      };
      var p = editing ? db.doc('students/'+editing.id).update(data)
                       : db.collection('students').add(Object.assign({active:true, createdAt: nowIso()}, data));
      p.then(function(){ showToast('저장됨'); closeModal(); })
       .catch(function(){ showToast('저장 실패', true); });
    });
  }

  function closeModal(){
    state.modalOpen = false;
    document.getElementById('modalRoot').innerHTML = '';
    render();
  }

  // ---------------- class modal ----------------
  function openClassModal(classId){
    var editing = classId ? getClass(classId) : null;
    state.modalOpen = true;
    var color = editing ? (editing.color||CLASS_COLORS[0]) : CLASS_COLORS[activeClasses().length % CLASS_COLORS.length];
    document.getElementById('modalRoot').innerHTML =
      '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">' +
        '<h3>'+(editing?'반 정보 수정':'새 반 만들기')+'</h3>' +
        '<div class="field"><label>반 이름 *</label><input type="text" id="mClsName" value="'+esc(editing?editing.name:'')+'" placeholder="예: 중2 수학 B반"></div>' +
        '<div class="field"><label>과목/설명</label><input type="text" id="mClsSubject" value="'+esc(editing?editing.subject:'')+'" placeholder="예: 중등 수학"></div>' +
        '<div class="field"><label>요일·시간</label><input type="text" id="mClsSchedule" value="'+esc(editing?editing.schedule:'')+'" placeholder="예: 월·수·금 16:00"></div>' +
        '<div class="field"><label>색상</label><div class="swatches" id="mClsSwatches">' +
          CLASS_COLORS.map(function(c){ return '<div class="swatch '+(c===color?'is-selected':'')+'" data-color="'+c+'" style="background:'+c+'"></div>'; }).join('') +
        '</div></div>' +
        '<div class="modal-actions">' +
          '<div>'+(editing?'<button class="btn-danger-text" id="mArchive">'+(editing.archived?'보관 해제':'반 보관하기')+'</button>':'<button class="btn btn-ghost" id="mCancel">취소</button>')+'</div>' +
          '<div class="modal-actions-right">'+(editing?'<button class="btn btn-ghost" id="mCancel2">취소</button>':'')+'<button class="btn btn-primary" id="mSave">저장</button></div>' +
        '</div>' +
      '</div></div>';
    var selectedColor = color;
    document.getElementById('mClsSwatches').addEventListener('click', function(e){
      var sw = e.target.closest('.swatch');
      if(!sw) return;
      selectedColor = sw.getAttribute('data-color');
      document.querySelectorAll('#mClsSwatches .swatch').forEach(function(s2){ s2.classList.toggle('is-selected', s2===sw); });
    });
    var cancelBtn = document.getElementById('mCancel') || document.getElementById('mCancel2');
    if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
    var cancel2 = document.getElementById('mCancel2');
    if(cancel2) cancel2.addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', function(e){ if(e.target.id==='modalBackdrop') closeModal(); });
    if(editing){
      document.getElementById('mArchive').addEventListener('click', function(){
        db.doc('classes/'+editing.id).update({archived: !editing.archived}).then(function(){
          showToast(editing.archived ? '보관 해제했어요' : '보관함으로 이동했어요');
          if(!editing.archived && state.selectedClassId === editing.id) state.selectedClassId = null;
          closeModal();
        }).catch(function(){ showToast('처리 실패', true); });
      });
    }
    document.getElementById('mSave').addEventListener('click', function(){
      var name = document.getElementById('mClsName').value.trim();
      if(!name){ showToast('반 이름을 입력해 주세요', true); return; }
      var data = {
        name: name,
        subject: document.getElementById('mClsSubject').value.trim(),
        schedule: document.getElementById('mClsSchedule').value.trim(),
        color: selectedColor
      };
      var p = editing ? db.doc('classes/'+editing.id).update(data)
                       : db.collection('classes').add(Object.assign({archived:false, createdAt: nowIso()}, data));
      p.then(function(ref){
        showToast('저장됨');
        closeModal();
        if(!editing && ref && ref.id) selectClass(ref.id);
      }).catch(function(){ showToast('저장 실패', true); });
    });
  }

  // ---------------- history tab ----------------
  function renderHistoryTab(){
    var students = state.students.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','ko'); });
    if(!students.length){
      document.getElementById('tabContent').innerHTML = '<div class="empty-state"><h2>학생을 먼저 등록해 주세요</h2><p>학생을 추가하면 이 곳에서 개인별 진도 히스토리를 볼 수 있어요.</p></div>';
      return;
    }
    if(!state.historyStudentId || !students.find(function(s){return s.id===state.historyStudentId;})){
      state.historyStudentId = students[0].id;
    }
    var sid = state.historyStudentId;
    var entries = state.sessions.filter(function(s){ return s.records && s.records[sid]; })
      .map(function(s){ return {date:s.date, topic:s.topic, rec: s.records[sid]}; })
      .sort(function(a,b){ return a.date < b.date ? 1 : -1; });

    var totalSessions = entries.length;
    var understandingVals = entries.filter(function(e){ return e.rec.understanding; }).map(function(e){ return e.rec.understanding; });
    var avgUnderstanding = understandingVals.length ? (understandingVals.reduce(function(a,b){return a+b;},0)/understandingVals.length) : 0;
    var hwTracked = entries.filter(function(e){ return e.rec.homeworkDone !== undefined; });
    var hwDone = hwTracked.filter(function(e){ return e.rec.homeworkDone; }).length;
    var hwRate = hwTracked.length ? Math.round(hwDone/hwTracked.length*100) : null;

    var timelineHtml = entries.map(function(e){
      var starsRo = '';
      for(var i=1;i<=5;i++) starsRo += '<span class="star readonly '+(e.rec.understanding>=i?'is-on':'')+'">★</span>';
      return '<div class="timeline-item">' +
        '<div class="tl-date">'+formatKoreanDate(e.date,{short:true})+'</div>' +
        '<div class="tl-body">' +
          (e.topic ? '<div class="tl-topic">'+esc(e.topic)+'</div>' : '') +
          '<div class="tl-progress">'+esc(e.rec.progress || '진도 기록 없음')+'</div>' +
          '<div class="tl-row">' +
            '<span>'+starsRo+' '+understandingLabel(e.rec.understanding)+'</span>' +
            (e.rec.homeworkAssigned ? '<span class="hw-badge '+(e.rec.homeworkDone?'done':'undone')+'">'+(e.rec.homeworkDone?'숙제 완료':'숙제 미완료')+'</span>' : '') +
          '</div>' +
          (e.rec.homeworkAssigned ? '<div class="tl-note">숙제: '+esc(e.rec.homeworkAssigned)+'</div>' : '') +
          (e.rec.note ? '<div class="tl-note">메모: '+esc(e.rec.note)+'</div>' : '') +
        '</div>' +
      '</div>';
    }).join('') || '<div class="empty-state" style="padding:30px 0;"><p>이 학생의 기록이 아직 없어요.</p></div>';

    document.getElementById('tabContent').innerHTML =
      '<div class="history-picker">' +
        '<select id="historySelect">' + students.map(function(s){ return '<option value="'+s.id+'" '+(s.id===sid?'selected':'')+'>'+esc(s.name)+(s.active===false?' (비활성)':'')+'</option>'; }).join('') + '</select>' +
      '</div>' +
      '<div class="stat-row">' +
        '<div class="stat-tile"><div class="num mono">'+totalSessions+'</div><div class="lbl">기록된 수업 수</div></div>' +
        '<div class="stat-tile"><div class="num mono">'+(avgUnderstanding?avgUnderstanding.toFixed(1):'-')+'</div><div class="lbl">평균 이해도 (5점)</div></div>' +
        '<div class="stat-tile"><div class="num mono">'+(hwRate!==null?hwRate+'%':'-')+'</div><div class="lbl">숙제 완료율</div></div>' +
      '</div>' +
      '<div class="timeline">'+timelineHtml+'</div>';

    document.getElementById('historySelect').addEventListener('change', function(e){
      state.historyStudentId = e.target.value;
      renderHistoryTab();
    });
  }

  // ---------------- global event wiring (static shell) ----------------
  document.getElementById('classList').addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit]');
    if(editBtn){ openClassModal(editBtn.getAttribute('data-edit')); return; }
    var row = e.target.closest('.class-row');
    if(row) selectClass(row.getAttribute('data-id'));
  });
  document.getElementById('addClassBtn').addEventListener('click', function(){ openClassModal(); });
  document.getElementById('archiveToggle').addEventListener('click', function(){
    state.showArchived = !state.showArchived;
    renderSidebar();
  });
  document.getElementById('tabNav').addEventListener('click', function(e){
    var btn = e.target.closest('[data-tab]');
    if(!btn) return;
    state.tab = btn.getAttribute('data-tab');
    renderTabNav();
    if(state.tab === 'record') loadSessionForDate();
    else renderTabContent();
  });

  init();
})();
</script>

</body></html>
